<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="swap" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c873a"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="20" ry="20" fill="url(#bg)"/>

  <!-- faint grid backdrop -->
  <g opacity="0.10" stroke="#ffffff" stroke-width="1">
    <path d="M4 32h92M4 52h92M4 72h92"/>
    <path d="M28 8v84M50 8v84M72 8v84"/>
  </g>

  <!-- dollar coin, the expensive SaaS side -->
  <g filter="url(#soft)">
    <circle cx="35" cy="38" r="20" fill="#3a3a45" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.6"/>
    <text x="35" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#e0b64f" font-weight="bold">$</text>
  </g>

  <!-- open-source node, the free side -->
  <g filter="url(#soft)">
    <circle cx="65" cy="62" r="20" fill="#1d2a1f" stroke="#3c873a" stroke-opacity="0.8" stroke-width="1.8"/>
    <path d="M57 62l5 5 11-12" fill="none" stroke="#4caf50" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- swap arrows between them -->
  <g fill="none" stroke="url(#swap)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M62 30H40l5-6"/>
    <path d="M38 70h22l-5 6"/>
  </g>
</svg>
